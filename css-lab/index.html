<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CSS 训练场 — 从选择器命中到布局与响应式</title>
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>

<header class="topbar">
  <button class="nav-btn" id="nav-btn" type="button" aria-expanded="false" aria-controls="sidebar">目录</button>
  <a class="brand" href="#home">CSS 训练场</a>
  <nav class="topnav">
    <a href="#home" data-route="home">总览</a>
    <a href="#playground" data-route="playground">练习场</a>
  </nav>
  <div class="topbar-right">
    <label class="switch" title="停止输入后自动渲染并检验">
      <input type="checkbox" id="auto-run" checked> 自动运行
    </label>
    <div class="progress-mini" title="总进度">
      <div class="progress-mini-track"><div class="progress-mini-fill" id="progress-fill"></div></div>
      <span id="progress-text">0/0</span>
    </div>
    <button class="btn btn-ghost btn-sm" id="reset-progress">重置进度</button>
  </div>
</header>

<div class="nav-backdrop" id="nav-backdrop"></div>
<div class="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main" id="main"></main>
</div>

<script src="assets/js/harness.js"></script>
<script src="assets/js/preview.js"></script>
<script src="assets/js/highlight.js"></script>
<script src="assets/js/pair.js"></script>
<script src="assets/js/render.js"></script>
<script src="content/ch01-selectors.js"></script>
<script src="content/ch02-box-model.js"></script>
<script src="content/ch03-cascade.js"></script>
<script src="content/ch04-display-position.js"></script>
<script src="content/ch05-flex.js"></script>
<script src="content/ch06-grid.js"></script>
<script src="content/ch07-variables-nesting.js"></script>
<script src="content/ch08-typography-color.js"></script>
<script src="content/ch09-responsive.js"></script>
<script src="content/ch10-container-utilities.js"></script>
<script src="content/ch11-transitions.js"></script>
<script src="content/ch12-states-a11y.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
