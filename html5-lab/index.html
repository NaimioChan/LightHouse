<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HTML5 训练场 — 从页面骨架到表单、媒体与存储</title>
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/app.css">

<body>

<header class="topbar">
  <a class="brand" href="#home">HTML5 训练场</a>
  <nav class="topnav">
    <a href="#home" data-route="home">总览</a>
    <a href="#playground" data-route="playground">练习场</a>
  </nav>
  <div class="topbar-right">
    <label class="switch" title="停止输入后自动渲染并检验">
      <input type="checkbox" id="auto-run" checked> 自动运行
    </label>
    <div class="progress-mini" title="总进度">
      <div class="progress-mini-track"><div class="progress-mini-fill" id="progress-fill"></div></div>
      <span id="progress-text">0/0</span>
    </div>
    <button class="btn btn-ghost btn-sm" id="reset-progress">重置进度</button>
  </div>
</header>

<div class="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main" id="main"></main>
</div>
